name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: design-tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frozen design tokens
        run: python3 scripts/check_design_tokens.py
      - name: M9 security checklist gate
        run: python3 scripts/security_checklist.py

  openapi:
    name: openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.2 lint openapi/openapi.yaml --config redocly.yaml

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/gradle/wrapper/gradle-wrapper.properties
      - name: Ktlint, Detekt, test
        working-directory: backend
        run: ./gradlew ktlintCheck detekt test --stacktrace --no-daemon
      - name: Dependency report (supply-chain review)
        working-directory: backend
        run: ./gradlew dependencies --configuration runtimeClasspath --no-daemon > build/dependency-report.txt
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/**
            backend/build/test-results/**
            backend/build/dependency-report.txt
          if-no-files-found: ignore

  admin:
    name: admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install, test, build
        working-directory: admin
        run: |
          npm ci
          npm test
          npm run build
      - name: npm audit (high+)
        working-directory: admin
        run: npm audit --audit-level=high

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties
      # v3 defaults to the obsolete `tools` package, which Google no longer
      # serves (`Failed to find package 'tools'`). v4 installs cmdline-tools
      # and accepts licenses; we request only packages that exist today.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android platforms and build-tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0"
      - name: Point Gradle at the SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
      - name: Lint, unit tests, debug and release (minify) verification
        working-directory: android
        run: |
          ./gradlew lintDebug ktlintCheck detekt test assembleDebug assembleRelease \
            :core:network:testReleaseUnitTest \
            :core:network:verifyReleaseMahinApiBaseUrlHttps \
            :app:verifyReleaseApkNoEmulatorApiHost \
            --stacktrace --no-daemon
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/**/build/outputs/apk/**
          if-no-files-found: ignore
