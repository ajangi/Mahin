spring:
  application:
    name: mahin-backend
  datasource:
    url: jdbc:h2:mem:mahin;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

mahin:
  api-version: 0.0.1
  environment: ${MAHIN_ENV:local}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/mahin-media}
  auth:
    jwt-secret: ${MAHIN_AUTH_JWT_SECRET:local-dev-only-m5-jwt-secret-32b-minimum}
    access-token-ttl-seconds: ${MAHIN_AUTH_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${MAHIN_AUTH_REFRESH_TTL_SECONDS:2592000}
    rate-limit-per-minute: ${MAHIN_AUTH_RATE_LIMIT_PER_MINUTE:120}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level requestId=%X{requestId} %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
