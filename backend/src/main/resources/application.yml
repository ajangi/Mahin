spring:
  application:
    name: mahin-backend
  datasource:
    url: jdbc:h2:mem:mahin;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

mahin:
  api-version: 0.0.1
  environment: ${MAHIN_ENV:local}
  features:
    health-connect: ${MAHIN_FEATURE_HEALTH_CONNECT:false}
    health-assistant: ${MAHIN_FEATURE_HEALTH_ASSISTANT:false}
  assistant:
    # Provider: none (fail closed), fake (local/test deterministic), or external vendor id (requires keys out-of-band).
    provider: ${MAHIN_ASSISTANT_PROVIDER:none}
    prompt-template-id: ${MAHIN_ASSISTANT_PROMPT_TEMPLATE:mahin-assistant-v0-placeholder}
    # Vendor keys (e.g. MAHIN_OPENAI_API_KEY) are never committed; wire in deployment secrets manager.
    openai-api-key: ${MAHIN_OPENAI_API_KEY:}
    openai-model: ${MAHIN_OPENAI_MODEL:gpt-4o-mini}
    log-retention-days: ${MAHIN_ASSISTANT_LOG_RETENTION_DAYS:90}
    log-retention-delay-ms: ${MAHIN_ASSISTANT_LOG_RETENTION_DELAY_MS:86400000}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9000/mahin-media}
  auth:
    jwt-secret: ${MAHIN_AUTH_JWT_SECRET:local-dev-only-m5-jwt-secret-32b-minimum}
    access-token-ttl-seconds: ${MAHIN_AUTH_ACCESS_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${MAHIN_AUTH_REFRESH_TTL_SECONDS:2592000}
    rate-limit-per-minute: ${MAHIN_AUTH_RATE_LIMIT_PER_MINUTE:120}
  privacy:
    deletion-grace-seconds: ${MAHIN_PRIVACY_DELETION_GRACE_SECONDS:1209600}
    deletion-processor-delay-ms: ${MAHIN_PRIVACY_DELETION_PROCESSOR_DELAY_MS:60000}
    deletion-max-attempts: ${MAHIN_PRIVACY_DELETION_MAX_ATTEMPTS:5}
    deletion-retry-base-seconds: ${MAHIN_PRIVACY_DELETION_RETRY_BASE_SECONDS:60}
    deletion-processing-timeout-seconds: ${MAHIN_PRIVACY_DELETION_PROCESSING_TIMEOUT_SECONDS:900}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level requestId=%X{requestId} %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
